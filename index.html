<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옆사람이 팔찌를 찍으면, 2분 안에 스태프가 온다</title>
<style>
  body { max-width: 760px; margin: 0 auto; padding: 48px 16px 40px; color: #000; font-family: "Malgun Gothic", sans-serif; line-height: 1.7; }
  h1 { font-size: 2.4rem; line-height: 1.3; margin: 0 0 32px; padding-bottom: 16px; border-bottom: 4px solid #C8102E; }
  section { margin: 0 0 32px; }
  ol { font-size: 1.15rem; margin: 0; padding-left: 1.6em; }
  li { margin-bottom: 10px; }
  li::marker { color: #C8102E; font-weight: bold; }
  figure { margin: 0 0 32px; }
  footer { font-size: 0.9rem; margin-top: 40px; padding-top: 12px; border-top: 1px solid #000; }
</style>
</head>
<body>

<h1>옆사람이 팔찌를 찍으면, 2분 안에 스태프가 온다</h1>

<section>
  <ol>
    <li>관객이 쓰러지면 주변이 소리쳐야 스태프가 안다</li>
    <li>관객 2명·스태프 1명에게 직접 들었다: "카톡뿐", "위치를 모른다"</li>
    <li>옆사람이 팔찌의 별을 찍으면 응급처치실 안 화면과 스태프 폰에 위치가 간다</li>
  </ol>
</section>

<figure>
  <img src="cut.jpg" alt="응급 순간, 태그할래? 말래? — 옆사람 팔찌의 별을 폰으로 찍자 신고 버튼이 뜨는 장면" style="display:block; width:100%; height:auto; border-radius:8px;">
</figure>

<section>
  <ol>
    <li>별(NFC)과 QR이 한 팔찌에 — 어떤 폰으로도 찍힌다</li>
    <li>찍는 순간 응급처치실과 스태프 폰에 동시에 간다</li>
    <li>신고된 좌석·구역으로 스태프가 통로를 따라 바로 간다</li>
  </ol>
</section>

<figure>
  <img src="effect.jpg" alt="기존 방식(소리치기·손 들기 → 스태프가 알아챔 → 위치를 찾아 헤맴 → 도착)과 팔찌 신고(별 찍기 → 응급처치실·스태프 폰 동시 알림 → 좌석으로 바로 출동) 비교 — 거치는 단계가 줄어든다" style="display:block; width:100%; height:auto; border-radius:8px;">
</figure>

<footer>
  <p>순천 1기 · 김찬미 / 2026-11-11 / 43일차 판</p>
</footer>

</body>
</html>
